# Fork-trimmed CI: a single C++ build + test on the platform this fork is
# developed on (macOS arm64, Accelerate + Ruy). No wheels, no publishing,
# no Docker/Pages/PyPI/Release jobs — those are upstream's release pipeline
# and don't belong on a personal fork (wrong PyPI package, your ghcr/Pages,
# 10x macOS minutes for things that don't test your changes).
#
# NOTE: this does NOT build the Metal backend (-DWITH_METAL=ON). GitHub-hosted
# macOS runners have no usable Metal GPU, so Metal stays gated by running
# tests/metal_test.cc locally (or on a self-hosted Apple Silicon runner).
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:   # run manually from the Actions tab on any branch

jobs:
  build-and-test-cpp-arm64:
    runs-on: macos-15
    env:
      CT2_VERBOSE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with Accelerate and Ruy
        run: |
          CMAKE_EXTRA_OPTIONS='-DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_ACCELERATE=ON -DWITH_MKL=OFF -DOPENMP_RUNTIME=NONE -DWITH_RUY=ON'
          cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DCMAKE_INSTALL_PREFIX=$PWD/install \
            -DBUILD_TESTS=ON \
            $CMAKE_EXTRA_OPTIONS \
            .
          make -j $(sysctl -n hw.ncpu) install

      - name: Download test data
        run: |
          curl -L -o transliteration-aren-all.tar.gz https://opennmt-models.s3.amazonaws.com/transliteration-aren-all.tar.gz
          tar xf transliteration-aren-all.tar.gz -C tests/data/models/

      - name: Test
        run: |
          tests/ctranslate2_test tests/data
